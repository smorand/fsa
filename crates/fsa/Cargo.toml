[package]
name = "fsa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Streamable-HTTP MCP server exposing a simulated multi-project filesystem (Rust port)"
publish = false

[[bin]]
name = "fsa"
path = "src/main.rs"

[features]
default = []
postgres = ["fsa-core/postgres"]
rag = ["fsa-core/rag"]
all-backends = ["fsa-core/all-backends"]
rar = ["fsa-core/rar"]

[dependencies]
tokio = { workspace = true }
fsa-core = { path = "../core" }

[dev-dependencies]
serde_json = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
